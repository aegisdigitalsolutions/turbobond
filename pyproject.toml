[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbobond"
version = "1.0.0"
description = "Multi-WAN bandwidth bonding gateway with SIP-transparent firewalling and one-click activation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "turbobond" }]
keywords = ["bonding", "multi-wan", "mptcp", "shadowsocks", "sip", "netgear", "nighthawk"]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.1",
    "jinja2==3.1.6",
    "psutil==7.2.2",
    "typer==0.27.2",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[project.scripts]
turbobond = "turbobond.cli:main"
turbobond-server = "turbobond.bond.server:main"

[project.urls]
Homepage = "https://github.com/aegisdigitalsolutions/turbobond"
Source = "https://github.com/aegisdigitalsolutions/turbobond"
Issues = "https://github.com/aegisdigitalsolutions/turbobond/issues"

[tool.setuptools.packages.find]
include = ["turbobond*"]

[tool.setuptools.package-data]
"turbobond.app" = ["web/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
