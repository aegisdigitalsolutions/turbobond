name: Android

# Builds the APK and keeps a downloadable copy attached to a "latest" release,
# so it can be installed on a phone from a browser without a build machine.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APK to latest release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Test the wire protocol
        working-directory: android
        run: ./gradlew :core:test

      - name: Build the APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: turbobond-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # A release asset is a plain link, which is what makes it installable
      # straight from a phone's browser. Artifacts need a GitHub login.
      - name: Publish the latest APK
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk turbobond.apk
          NOTES="Built from ${{ github.sha }}.

          Download \`turbobond.apk\` below and open it on the phone. Android
          will ask you to allow installing from unknown sources.

          Signed with the standard Android debug key, which is enough to
          sideload but not to publish."

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest turbobond.apk --clobber
            gh release edit latest \
              --title "turbobond for Android (latest build)" \
              --notes "$NOTES"
          else
            gh release create latest turbobond.apk \
              --title "turbobond for Android (latest build)" \
              --notes "$NOTES"
          fi
